kind = "web"
previewPath = "/"
title = "V6 Trader Assistance"
description = "A futures trading workspace with an OpenAI chat integration, chart analysis, journaling, risk tools, and clearly labeled sample market data. Chat requires a valid server-side key and has no live market feed or trade execution."
version = "1.0.0"
id = "artifacts/v6-trader-assistance"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22485

[services.development]
run = "pnpm --filter @workspace/v6-trader-assistance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/v6-trader-assistance", "run", "build" ]
serve = "static"
publicDir = "artifacts/v6-trader-assistance/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22485"
BASE_PATH = "/"
